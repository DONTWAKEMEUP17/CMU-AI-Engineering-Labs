global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'node'

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
        - targets: ['localhost:9090'] #target here
         
  - job_name: 'kafka-monitoring'
    scrape_interval: 5s
    static_configs:
        - targets: ['host.docker.internal:8765'] # host.docker.internal is used to access 
        # the host machine from within a Docker container. The port 8765 is where the Kafka 
        # monitoring metrics are exposed.

  - job_name: 'node_exporter'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'host.docker.internal:9100' ] # node-exporter actually both runs on the host machine and inside the Docker container. 
      # docker container can access it via host.docker.internal. The port 9100 is where the node-exporter metrics are exposed. [docker.yml port mapping: 9100:9100]